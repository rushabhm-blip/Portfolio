    <style>
        :root {
            color-scheme: dark;
            --font-main: 'Google Sans Flex', 'Google Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --text-heading: #f4f6f4;
            --text-body: #8ea395;
            
            /* Diagram Palette */
            --color-med-sig: #d63053;   /* Venomous */
            --color-venomous: #e69119;  /* Mildly Venomous */
            --color-non-ven: #10ac84;   /* Non-Venomous */
            --color-dimmed: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: var(--font-main);
            background: transparent !important;
            color: var(--text-heading);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .chart-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Interactive Legend */
        .interactive-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .legend-card {
            display: flex;
            align-items: center;
            padding: 9px 18px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .legend-card:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.28);
            transform: translateY(-2px);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .legend-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-heading);
            letter-spacing: 0.01em;
        }

        .legend-percent {
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-ms .legend-percent { color: var(--color-med-sig); }
        .card-v .legend-percent { color: var(--color-venomous); }
        .card-nv .legend-percent { color: #1dd1a1; }

        .legend-card:hover .legend-percent {
            max-width: 110px;
            opacity: 1;
            margin-left: 8px;
        }

        /* Dot Grid */
        .dot-matrix {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transform: scale(0);
            opacity: 0;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background-color 0.3s ease, 
                        opacity 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .dot:hover {
            transform: scale(1.38) !important;
            z-index: 10;
        }

        .type-ms { 
            background-color: var(--color-med-sig); 
            box-shadow: 0 0 10px rgba(214, 48, 83, 0.35);
        }
        .type-v { 
            background-color: var(--color-venomous); 
            box-shadow: 0 0 10px rgba(230, 145, 25, 0.25);
        }
        .type-nv { 
            background-color: var(--color-non-ven); 
            box-shadow: 0 0 10px rgba(16, 172, 132, 0.25);
        }

        .dot.dimmed {
            background-color: var(--color-dimmed);
            box-shadow: none;
            transform: scale(0.65) !important;
            opacity: 0.45 !important;
        }

        .chart-container.in-view .dot {
            transform: scale(1);
            opacity: 1;
        }

        /* Tooltip */
        #tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            background: rgba(5, 16, 11, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            color: var(--text-heading);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
            max-width: 260px;
        }

        #tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #tooltip .t-name {
            font-weight: 700;
            font-size: 13px;
            color: #ffffff;
            display: block;
        }

        #tooltip .t-sci {
            font-style: italic;
            color: var(--text-body);
            font-size: 11px;
            display: block;
            margin-bottom: 6px;
        }

        #tooltip .t-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
        }

        #tooltip .t-badge {
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        @media (max-width: 768px) {
            .chart-container { padding: 12px; }
            .dot { width: 14px; height: 14px; }
            .dot-matrix { gap: 6px; }
            .legend-card { padding: 8px 14px; }
            .legend-title { font-size: 0.78rem; }
        }
    </style>
</head>

            {"name": "Sinomicrurus macclellandi univirgatus", "sci": "Sinomicrurus macclellandi univirgatus", "count": 1, "cat": "nv", "label": "Non-venomous"},

            {"name": "Narrow-banded Rain Snake", "sci": "Smithophis leptofasciatus", "count": 1, "cat": "nv", "label": "Non-venomous"},
            {"name": "Teretrurus siruvaniensis", "sci": "Teretrurus siruvaniensis", "count": 1, "cat": "nv", "label": "Non-venomous"},
            {"name": "Mountain Worm-eating Snake", "sci": "Trachischium monticola", "count": 1, "cat": "nv", "label": "Non-venomous"},
            {"name": "Red-lined Earth Snake", "sci": "Uropeltis rubrolineata", "count": 1, "cat": "nv", "label": "Non-venomous"}
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const matrixContainer = document.getElementById('dotMatrix');
            const legendCards = document.querySelectorAll('.legend-card');
            const tooltip = document.getElementById('tooltip');

            const total = snakesData.length;
            const counts = {
                ms: snakesData.filter(s => s.cat === 'ms').length,
                v: snakesData.filter(s => s.cat === 'v').length,
                nv: snakesData.filter(s => s.cat === 'nv').length
            };

            document.getElementById('pct-ms').textContent = `${counts.ms} (${(counts.ms / total * 100).toFixed(1)}%)`;
            document.getElementById('pct-v').textContent = `${counts.v} (${(counts.v / total * 100).toFixed(1)}%)`;
            document.getElementById('pct-nv').textContent = `${counts.nv} (${(counts.nv / total * 100).toFixed(1)}%)`;

            const badgeColors = {
                ms: '#d63053',
                v: '#e69119',
                nv: '#1dd1a1'
            };

            snakesData.forEach((snake, i) => {
                const dot = document.createElement('div');
                dot.classList.add('dot', `type-${snake.cat}`);
                dot.setAttribute('data-category', snake.cat);

                const delay = (i * 2.5) + (Math.random() * 15);
                dot.style.transitionDelay = `${delay}ms, 0s, 0s, 0s`;

                dot.addEventListener('pointerenter', (e) => {
                    dot.style.transitionDelay = '0s';
                    tooltip.innerHTML = `
                        <span class="t-name">${snake.name}</span>
                        <span class="t-sci">${snake.sci}</span>
                        <div class="t-meta">
                            <span class="t-badge" style="color:${badgeColors[snake.cat]}">${snake.label}</span>
                            <span>${snake.count.toLocaleString()} ${snake.count === 1 ? 'sighting' : 'sightings'}</span>
                        </div>
                    `;
                    tooltip.classList.add('visible');
                    moveTooltip(e);
                });

                dot.addEventListener('pointermove', moveTooltip);
                dot.addEventListener('pointerleave', () => {
                    tooltip.classList.remove('visible');
                });

                matrixContainer.appendChild(dot);
            });

            function moveTooltip(e) {
                const pad = 14;
                const x = Math.min(window.innerWidth - 270, e.clientX + pad);
                const y = Math.max(12, e.clientY - 68);
                tooltip.style.left = `${x}px`;
                tooltip.style.top = `${y}px`;
            }

            const allDots = document.querySelectorAll('.dot');

            legendCards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    const hoverType = card.getAttribute('data-hover');
                    allDots.forEach(dot => {
                        dot.style.transitionDelay = '0s';
                        if (dot.getAttribute('data-category') !== hoverType) {
                            dot.classList.add('dimmed');
                        } else {
                            dot.classList.remove('dimmed');
                        }
                    });
                });

                card.addEventListener('mouseleave', () => {
                    allDots.forEach(dot => {
                        dot.classList.remove('dimmed');
                    });
                });
            });
        });
    </script>
</body>
