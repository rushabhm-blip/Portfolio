<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 590" width="340" height="590">
  <defs>
    <!-- Detailed botanical arabesque repeating pattern -->
    <pattern id="cardPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M18 0 C22 8 28 14 36 18 C28 22 22 28 18 36 C14 28 8 22 0 18 C8 14 14 8 18 0 Z" fill="none" stroke="#243D2C" stroke-width="1" opacity="0.65"/>
      <circle cx="18" cy="18" r="4" fill="none" stroke="#243D2C" stroke-width="0.8" opacity="0.75"/>
      <circle cx="18" cy="18" r="1.5" fill="#243D2C" opacity="0.6"/>
      <path d="M0 0 L6 6 M36 0 L30 6 M0 36 L6 30 M36 36 L30 30" stroke="#243D2C" stroke-width="0.8" opacity="0.5"/>
      <circle cx="0" cy="0" r="2" fill="#243D2C" opacity="0.4"/>
      <circle cx="36" cy="0" r="2" fill="#243D2C" opacity="0.4"/>
      <circle cx="0" cy="36" r="2" fill="#243D2C" opacity="0.4"/>
      <circle cx="36" cy="36" r="2" fill="#243D2C" opacity="0.4"/>
    </pattern>

    <!-- Corner Ornaments -->
    <g id="cornerOrnament">
      <path d="M 0,0 L 28,0 C 28,14 14,28 0,28 Z" fill="none" stroke="#243D2C" stroke-width="1.2" opacity="0.85"/>
      <path d="M 4,4 L 20,4 C 20,12 12,20 4,20 Z" fill="#243D2C" opacity="0.15"/>
      <circle cx="10" cy="10" r="2" fill="#243D2C" opacity="0.7"/>
    </g>
  </defs>

  <!-- Parchment Base -->
  <rect x="0" y="0" width="340" height="590" rx="10" fill="#FAF6EA"/>

  <!-- Outer Border -->
  <rect x="7" y="7" width="326" height="576" rx="6" fill="none" stroke="#243D2C" stroke-width="1.5" opacity="0.9"/>

  <!-- Inner Margin Frame -->
  <rect x="14" y="14" width="312" height="562" rx="4" fill="none" stroke="#243D2C" stroke-width="1" stroke-dasharray="4,2" opacity="0.75"/>

  <!-- Intricate Pattern Field -->
  <rect x="22" y="22" width="296" height="546" rx="3" fill="url(#cardPattern)"/>

  <!-- Solid Inner Border around Pattern -->
  <rect x="22" y="22" width="296" height="546" rx="3" fill="none" stroke="#243D2C" stroke-width="1.2" opacity="0.9"/>

  <!-- Corner Flourishes -->
  <use href="#cornerOrnament" x="22" y="22" />
  <use href="#cornerOrnament" x="318" y="22" transform="scale(-1, 1) translate(-340, 0)" />
  <use href="#cornerOrnament" x="22" y="568" transform="scale(1, -1) translate(0, -590)" />
  <use href="#cornerOrnament" x="318" y="568" transform="scale(-1, -1) translate(-340, -590)" />

  <!-- Center Decorative Medallion -->
  <g transform="translate(170, 295)">
    <!-- Medallion Scrim -->
    <rect x="-65" y="-95" width="130" height="190" rx="65" fill="#FAF6EA" stroke="#243D2C" stroke-width="1.5" opacity="0.95"/>
    <rect x="-57" y="-87" width="114" height="174" rx="57" fill="none" stroke="#243D2C" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.7"/>

    <!-- Central Symmetrical Flora -->
    <path d="M 0,-60 C 18,-40 28,-15 0,35 C -28,-15 -18,-40 0,-60 Z" fill="#243D2C" opacity="0.18"/>
    <path d="M 0,-60 C 18,-40 28,-15 0,35 C -28,-15 -18,-40 0,-60 Z" fill="none" stroke="#243D2C" stroke-width="1.2" opacity="0.85"/>
    
    <path d="M 0,60 C 18,40 28,15 0,-35 C -28,15 -18,40 0,60 Z" fill="#243D2C" opacity="0.18"/>
    <path d="M 0,60 C 18,40 28,15 0,-35 C -28,15 -18,40 0,60 Z" fill="none" stroke="#243D2C" stroke-width="1.2" opacity="0.85"/>

    <!-- Center Rosette -->
    <circle cx="0" cy="0" r="16" fill="#FAF6EA" stroke="#243D2C" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="11" fill="none" stroke="#243D2C" stroke-width="0.8" stroke-dasharray="2,2"/>
    <circle cx="0" cy="0" r="5" fill="#243D2C" opacity="0.8"/>

    <!-- Subtle Star Points -->
    <polygon points="0,-14 3,-5 12,-5 5,1 8,10 0,5 -8,10 -5,1 -12,-5 -3,-5" fill="#243D2C" opacity="0.6"/>
  </g>
</svg>
