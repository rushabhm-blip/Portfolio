<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Look Closer Preview Test</title>
<style>
  body {
    margin: 0;
    background: #0d1a12 url('assets/forest_hero_bg.png') no-repeat center center fixed;
    background-size: cover;
    color: #EEECE3;
    font-family: sans-serif;
  }
  .stage {
    position: relative;
    width: 900px;
    height: 506px;
    margin: 40px auto;
    border: 1px solid rgba(255,255,255,0.2);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    text-align: center;
    padding: 10px;
  }
  input[type=range] {
    width: 600px;
  }
</style>
</head>
<body>
<div class="controls">
  <input type="range" id="slider" min="0" max="1000" value="0">
  <span id="label">0%</span>
</div>
<div class="stage">
  <canvas id="cv" width="1672" height="941"></canvas>
</div>
<script>
const frames = [];
for (let i = 1; i <= 12; i++) {
  const img = new Image();
  img.src = `assets/look_closer/frame-${String(i).padStart(2, '0')}.png`;
  frames.push(img);
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const slider = document.getElementById('slider');
const label = document.getElementById('label');

function render(p) {
  ctx.clearRect(0, 0, 1672, 941);
  // Pick frame
  const fIdx = Math.min(11, Math.floor(p * 12));
  const img = frames[fIdx];
  if (img && img.complete) {
    ctx.drawImage(img, 0, 0, 1672, 941);
  }
}

slider.addEventListener('input', (e) => {
  const p = e.target.value / 1000;
  label.textContent = (p * 100).toFixed(1) + '%';
  render(p);
});

Promise.all(frames.map(img => new Promise(res => {
  if (img.complete) res();
  else img.onload = res;
}))).then(() => {
  render(0);
});
</script>
</body>
</html>
