<!DOCTYPE html>
<html>
<head>
<title>Inspect Frames</title>
<style>
  body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .card { background: #222; padding: 10px; border-radius: 8px; }
  canvas { width: 100%; border: 1px solid #444; background: #03120B; }
</style>
</head>
<body>
<h1>Frame Inspector</h1>
<div id="results"></div>
<div class="grid" id="container"></div>

<script>
const imageNames = [
  'img_0.png', 'img_1.png', 'img_2.png', 'img_3.png', 'img_4.png',
  'img_5.png', 'img_6.png', 'img_7.png', 'img_8.png', 'img_9.png'
];

async function inspect() {
  const container = document.getElementById('container');
  const results = document.getElementById('results');
  const data = [];

  for (let i = 0; i < imageNames.length; i++) {
    const name = imageNames[i];
    const img = new Image();
    img.src = 'assets/frames/' + name;
    await new Promise(r => img.onload = r);

    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imgData.data;

    // Find bounding box of all non-transparent pixels (alpha > 20)
    let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
    // Villager bounding box (x > width * 0.6)
    let vMinX = canvas.width, vMaxX = 0, vMinY = canvas.height, vMaxY = 0;
    // Snake bounding box (x < width * 0.65, y > height * 0.5)
    let sMinX = canvas.width, sMaxX = 0, sMinY = canvas.height, sMaxY = 0;

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const idx = (y * canvas.width + x) * 4;
        const a = pixels[idx + 3];
        if (a > 30) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;

          // Villager
          if (x > canvas.width * 0.65) {
            if (x < vMinX) vMinX = x;
            if (x > vMaxX) vMaxX = x;
            if (y < vMinY) vMinY = y;
            if (y > vMaxY) vMaxY = y;
          }

          // Snake (avoid flashlight beam which has low saturation or alpha)
          // Flashlight beam is semi-transparent warm/pale yellow (r~g>b, alpha < 180)
          // Snake has dark outlines / patterns (r,g,b < 80)
          if (x < canvas.width * 0.70 && y > canvas.height * 0.65) {
            const r = pixels[idx], g = pixels[idx+1], b = pixels[idx+2];
            // Check if it's solid snake body (not faint light beam)
            const isDark = (r < 100 || g < 100);
            if (isDark && a > 100) {
              if (x < sMinX) sMinX = x;
              if (x > sMaxX) sMaxX = x;
              if (y < sMinY) sMinY = y;
              if (y > sMaxY) sMaxY = y;
            }
          }
        }
      }
    }

    const info = {
      index: i,
      name,
      width: canvas.width,
      height: canvas.height,
      villager: { x: vMinX, y: vMinY, w: vMaxX - vMinX, h: vMaxY - vMinY, footY: vMaxY },
      snake: { x: sMinX, y: sMinY, w: sMaxX - sMinX, h: sMaxY - sMinY, centerX: (sMinX + sMaxX) / 2 }
    };
    data.push(info);

    // Draw bounding boxes on canvas for visual verification
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 4;
    ctx.strokeRect(vMinX, vMinY, vMaxX - vMinX, vMaxY - vMinY);

    ctx.strokeStyle = '#ff0055';
    ctx.strokeRect(sMinX, sMinY, sMaxX - sMinX, sMaxY - sMinY);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h3>[${i}] ${name}</h3>
      <p>Villager: x=${vMinX}, y=${vMinY}, w=${vMaxX - vMinX}, h=${vMaxY - vMinY}, baseline=${vMaxY}</p>
      <p>Snake: x=${sMinX}, y=${sMinY}, w=${sMaxX - sMinX}, h=${sMaxY - sMinY}, centerX=${((sMinX + sMaxX)/2).toFixed(0)}</p>`;
    card.appendChild(canvas);
    container.appendChild(card);
  }

  results.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
}

inspect();
</script>
</body>
</html>
