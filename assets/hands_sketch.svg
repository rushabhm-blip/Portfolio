  <!-- Left Hand Gripping Over Ledge -->
  <g class="hand-left">
    <!-- Palm / Knuckles curve -->
    <path d="M 45 42 Q 42 22 46 12 Q 49 4 56 4 Q 62 4 64 12 L 64 24" />
