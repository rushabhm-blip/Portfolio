  <!-- Immediate critical viewport-responsive geometry calculation before first paint (CLS = 0) -->
  <script>
    (function() {
      try {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var spreadRatio = 1586 / 992;
        var headerH = 68;
        var availH = Math.max(300, vh - headerH - 40);
        var safeMarginX = 24;
        var availW = Math.max(300, vw - safeMarginX * 2);
        var spreadW, spreadH, pageW, pageH;
        if (vw >= 1024) {
          var maxSpreadW = availW - 120;
          var maxHFromW = Math.floor(maxSpreadW / spreadRatio);
          var maxHFromAvail = Math.floor(availH * 0.88);
          var targetH = Math.min(maxHFromW, maxHFromAvail, 680);
          spreadH = Math.max(targetH, 470);
          spreadW = Math.round(spreadH * spreadRatio);
          pageW = Math.round(spreadW / 2);
          pageH = spreadH;
        } else if (vw >= 768) {
          var maxSpreadW = availW - 80;
          var maxHFromW = Math.floor(maxSpreadW / spreadRatio);
          var maxHFromAvail = Math.floor(availH * 0.88);
          var targetH = Math.min(maxHFromW, maxHFromAvail, 580);
          spreadH = Math.max(targetH, 440);
          spreadW = Math.round(spreadH * spreadRatio);
          pageW = Math.round(spreadW / 2);
          pageH = spreadH;
        } else {
          pageW = Math.min(availW, 440);
          pageH = Math.round(pageW / 0.8);
          spreadW = pageW;
          spreadH = pageH;
        }
        var root = document.documentElement;
        root.style.setProperty('--spread-width', spreadW + 'px');
        root.style.setProperty('--spread-height', spreadH + 'px');
        root.style.setProperty('--page-width', pageW + 'px');
        root.style.setProperty('--page-height', pageH + 'px');
        root.style.setProperty('--book-width', pageW + 'px');
        root.style.setProperty('--book-height', pageH + 'px');
      } catch (e) {}
    })();
  </script>

  <!-- Critical inline styles ensuring intentional entrance before first paint -->
  <style>
    body {
      background-color: #0647fa;
      margin: 0;
      color: #080807;
    }
    .site-header {
      opacity: 1;
      visibility: visible;
    }
    .book-stage {
      position: relative;
      width: var(--spread-width, 1180px);
      height: var(--spread-height, 738px);
    }
    @media (max-width: 768px) {
      .book-stage {
        width: var(--book-width, 360px);
        height: var(--book-height, 450px);
      }
    }
    /* Hidden initial states: complete book must decode before opacity reveal */
    .book-base,
    .book-base-picture img {
      opacity: 0;
    }
    /* Cover overlays and drag hint hidden initially */
    .closed-cover-inner .intro-block,
    .closed-cover-inner .sticker-drag-wrapper,
    .closed-cover-inner .open-book-btn,
    .closed-cover-inner .book-grid,
    .sticker-drag-hint,
    .id-tag-wrapper {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .crawler-video {
      opacity: 0;
      pointer-events: none;
    }
    /* Inside pages strictly hidden while closed or loading */
    .book-stage.is-closed .page-right,
    .book-stage.is-loading .page-right,
    .book-stage.is-closed .spread-base,
    .book-stage.is-loading .spread-base,
    .book-stage.is-closed .mobile-paper-frame,
    .book-stage.is-loading .mobile-paper-frame,
    .book-stage.is-closed .cover-face-back,
    .book-stage.is-loading .cover-face-back {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
