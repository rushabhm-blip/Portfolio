<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rushabh — Portfolio</title>
  <script src="password-gate.js"></script>

  <!-- Preload fonts -->
  <link rel="preload" href="fonts/Inter-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Caveat-variable.ttf" as="font" type="font/ttf" crossorigin>

  <link rel="stylesheet" href="sketchbook.css?v=4">
</head>
<body>
  <div id="appRoot">
    <header class="site-header">
      <a class="wordmark" href="/">rushabh<span>.</span></a>
      <nav aria-label="Main navigation">
        <button type="button" class="nav-item active" data-chapter="Home">Home</button>
        <button type="button" class="nav-item" data-chapter="Works">Works</button>
        <button type="button" class="nav-item" data-chapter="About">About</button>
        <button type="button" class="nav-item" data-chapter="Playground">Playground</button>
        <button type="button" class="nav-item" data-chapter="Architecture">Architecture</button>
      </nav>
    </header>

    <main class="main-stage">
      <div class="book-stage">
        <div class="id-tag-wrapper" aria-hidden="true">
          <img class="id-tag-img" src="assets/sketchbook/4k/id-tag.png" srcset="assets/sketchbook/native/id-tag.png 1x, assets/sketchbook/4k/id-tag.png 2x" alt="Design school ID tag" loading="eager" decoding="async">
        </div>
        <div class="book">
          <img class="book-base" src="assets/sketchbook/4k/blank-book.png" srcset="assets/sketchbook/native/blank-book.png 1x, assets/sketchbook/4k/blank-book.png 2x" alt="" loading="eager" decoding="async">
          <div class="book-grid" aria-hidden="true"></div>
          <div class="sticker-role" aria-label="HELLO, I’M Interaction Designer">
            <strong class="role-header">HELLO, I’M</strong>
            <span class="role-body">Interaction<br>Designer</span>
          </div>
          <img class="sticker-portrait" src="assets/sketchbook/4k/portrait-sticker.png" srcset="assets/sketchbook/native/portrait-sticker.png 1x, assets/sketchbook/4k/portrait-sticker.png 2x" alt="Illustrated smiling portrait of Rushabh" loading="eager" decoding="async">
          <div class="intro-block">
            <p class="intro-greeting">Hi, I’m</p>
            <h1 class="intro-name">Rushabh.</h1>
            <img class="intro-underline" src="assets/sketchbook/underline.svg" alt="" aria-hidden="true">
            <p class="intro-tagline">Things I notice. Things I make.</p>
          </div>
          <img class="sticker-cursor" src="assets/sketchbook/4k/cursor-sticker.png" srcset="assets/sketchbook/native/cursor-sticker.png 1x, assets/sketchbook/4k/cursor-sticker.png 2x" alt="Make it useful sticker with blue cursor" loading="eager" decoding="async">
          <button type="button" class="open-book-btn" aria-label="Open my sketchbook" data-chapter="Sketchbook">
            <span class="open-book-label">Open my sketchbook</span>
            <img class="curved-arrow-img" src="assets/sketchbook/curved-arrow.svg" alt="" aria-hidden="true">
            <b class="lime-circle" aria-hidden="true">
              <img class="arrow-right-img" src="assets/sketchbook/arrow-right.svg" alt="">
            </b>
          </button>
        </div>
      </div>
    </main>

    <dialog id="chapterDialog" class="chapter-dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-content">
        <button type="button" class="dialog-close-btn" aria-label="Close dialog">×</button>
        <p class="dialog-eyebrow" id="dialogEyebrow">NEXT CHAPTER</p>
        <h2 class="dialog-title" id="dialogTitle">Works</h2>
        <p class="dialog-desc" id="dialogDesc">Explore chapter details and case studies.</p>
        <div class="dialog-projects" id="dialogProjects"></div>
        <div class="dialog-actions">
          <button type="button" class="dialog-back-btn">Back to the cover</button>
        </div>
      </div>
    </dialog>
  </div>

  <script type="module" src="sketchbook.js?v=2"></script>
</body>
</html>
